[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "w2rep"
version = "0.1.0"
description = "Training and evaluation code for W2Rep"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
  "torch>=2.1",
  "torchvision>=0.16",
]

[project.optional-dependencies]
train = ["tensorboard>=2.14"]
test = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["w2rep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

